[project]
name = "bank-transaction-categorizer"
version = "0.1.0"
description = "MVP: categorization of personal bank transactions using rules + LLM fallback"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas==2.2.2",
  "numpy==1.26.4",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "httpx==0.27.0",
  "tenacity==8.5.0",
  "scikit-learn==1.5.1",
  "matplotlib==3.9.1",
  "python-dotenv==1.0.1",
  "tqdm==4.66.5",
  "SQLAlchemy==2.0.32",
  "psycopg[binary]==3.2.1",
  "fastapi==0.112.2",
  "uvicorn[standard]==0.30.6"
]

[project.optional-dependencies]
dev = ["pytest==8.3.2", "ruff==0.5.7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools==72.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "reports*", "tests*"]
