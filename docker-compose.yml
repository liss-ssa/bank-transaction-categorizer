services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-tx-categorizer:0.1.0
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL

  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_DB: banktx
      POSTGRES_USER: banktx
      POSTGRES_PASSWORD: banktx_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banktx -d banktx"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
